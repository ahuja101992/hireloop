spring:
  application:
    name: hireloop

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hireloop}
    username: ${DB_USERNAME:hireloop_user}
    password: ${DB_PASSWORD:hireloop_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: hireloop
    show-sql: false

  flyway:
    enabled: false

llm:
  provider: claude
  claude:
    api-key: ${CLAUDE_API_KEY}
    model: claude-3-5-sonnet-20241022

gmail:
  enabled: false
  service-account-key-path: ${GMAIL_KEY_PATH}
  user-email: ${GMAIL_USER_EMAIL}

logging:
  level:
    root: INFO
    com.hireloop: DEBUG
    org.hibernate.SQL: DEBUG
