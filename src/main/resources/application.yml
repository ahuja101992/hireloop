spring:
  application:
    name: hireloop

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hireloop}
    username: ${DB_USERNAME:hireloop_user}
    password: ${DB_PASSWORD:hireloop_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: hireloop
    show-sql: false

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

llm:
  provider: claude
  claude:
    api-key: ${CLAUDE_API_KEY}
    model: claude-sonnet-4-6

gmail:
  enabled: true
  service-account-key-path: ${GMAIL_OAUTH_CREDENTIALS}
  user-email: ${GMAIL_ADDRESS}

apply-engine:
  enabled: false
  headless: true
  user-name: ${USER_NAME:Akshita Huja}
  user-email: ${GMAIL_ADDRESS:}
  user-phone: ${USER_PHONE:}
  resume-path: resume/resume.docx

logging:
  level:
    root: INFO
    com.hireloop: DEBUG
    org.hibernate.SQL: DEBUG
